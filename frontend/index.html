<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORTEXLAB — AI Research, Evaluation & Experimentation Laboratory</title>
    <meta name="description" content="Interactive laboratory for understanding, evaluating, and experimenting with modern AI systems. AI Playground, RAG Lab with Failure Analysis, Embedding Space, Attention Visualizer, Model Benchmarks." />
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind Play CDN for high-performance zero-lockup rendering -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: "#09090B",
              panel: "#111113",
              "panel-hover": "#18181B",
              border: "#27272A",
              "border-light": "#3F3F46",
              primary: "#FAFAFA",
              secondary: "#A1A1AA",
              muted: "#71717A",
              accent: {
                DEFAULT: "#06B6D4",
                light: "#22D3EE",
                dark: "#0891B2",
                glow: "rgba(6, 182, 212, 0.15)",
              },
              success: {
                DEFAULT: "#10B981",
                glow: "rgba(16, 185, 129, 0.15)",
              },
              warning: {
                DEFAULT: "#F59E0B",
                glow: "rgba(245, 158, 11, 0.15)",
              },
              error: {
                DEFAULT: "#EF4444",
                glow: "rgba(239, 68, 68, 0.15)",
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            boxShadow: {
              'glow-cyan': '0 0 20px -5px rgba(6, 182, 212, 0.25)',
              'panel': '0 4px 20px -2px rgba(0, 0, 0, 0.5)',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#09090B] text-[#FAFAFA] antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
